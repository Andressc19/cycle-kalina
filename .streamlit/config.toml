# Tema visual de la UI del ciclo Kalina KSC-11.
# Dashboard moderno: sans-serif, neutros fríos (slate) y un teal profundo
# como color primario. El pulido fino (tarjetas de métricas, botones,
# sidebar, tabs) vive en `src/ui_estilo.py`.
[theme]
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
font = "sans-serif"
